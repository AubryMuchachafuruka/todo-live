name: street_league
description: Street League — Chitungwiza Street Champions. A complete Zimbabwean street football game with achievements, milestones, trophies and player progression.
author: MD.dev <dev@muchafz.com>
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  mockito: ^5.4.4
  lint: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/trophies/
    - assets/images/badges/
    - assets/images/portraits/
    - assets/images/grounds/
    - assets/images/kits/
    - assets/audio/effects/
    - assets/audio/commentary/
    - assets/audio/music/
    - assets/audio/ambience/
  fonts:
    - family: StreetDisplay
      fonts:
        - asset: assets/fonts/StreetDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/StreetDisplay-Bold.ttf
          weight: 700
